# Off-site backup of the Supabase database (the free plan has no backups of its own).
#
# Weekly, and on demand (Actions → Database backup → Run workflow): dumps roles, schema and data
# with the Supabase CLI, encrypts them (AES-256, the passphrase lives only in the repo secrets)
# and keeps the file as a workflow artifact for 90 days. The repository is public, so the dump is
# never uploaded unencrypted. Restore: scripts/db-restore.sh (docs/SUPABASE.md → Backup).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     Supabase → Connect → "Session pooler" URI, with the database password
#                       (the direct connection is IPv6-only; GitHub runners are IPv4).
#   BACKUP_PASSPHRASE   long random passphrase; keep a copy in a password manager.
name: Database backup

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Dump roles, schema and data
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_DB_URL" ]; then echo "::error::Missing secret SUPABASE_DB_URL"; exit 1; fi
          mkdir backup
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          # Data of the app (public) and of the accounts (auth, so user_id keeps pointing somewhere).
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/data.sql --use-copy --data-only --schema public,auth
          ls -l backup

      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$BACKUP_PASSPHRASE" ]; then echo "::error::Missing secret BACKUP_PASSPHRASE"; exit 1; fi
          name="habits-db-$(date -u +%Y-%m-%d).tar.gz.enc"
          tar -czf - backup | openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -pass env:BACKUP_PASSPHRASE -out "$name"
          rm -rf backup
          echo "NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}
          retention-days: 90
          if-no-files-found: error
